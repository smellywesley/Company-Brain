###############################################################################
# Company Brain – Docker Compose (production-grade)
# All services run on the private "brain-net" overlay and persist data via
# named volumes.  Secrets are injected through a .env file (never committed).
###############################################################################

services:
  # ---------------------------------------------------------------------------
  # Frontend – Next.js (multi-stage, non-root, Alpine)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cb-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000}
      - NEXT_PUBLIC_OKTA_DOMAIN=${OKTA_DOMAIN}
      - NEXT_PUBLIC_OKTA_CLIENT_ID=${OKTA_CLIENT_ID}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - brain-net

  # ---------------------------------------------------------------------------
  # Backend – FastAPI / Uvicorn
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cb-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - WEAVIATE_URL=http://weaviate:8080
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_AUTH=${NEO4J_AUTH}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - API_TOKEN=${API_TOKEN}
      - OKTA_DOMAIN=${OKTA_DOMAIN}
      - OKTA_CLIENT_ID=${OKTA_CLIENT_ID}
      - OKTA_CLIENT_SECRET=${OKTA_CLIENT_SECRET}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cb_admin}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-companybrain}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-cb_admin}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-companybrain}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change-me-redis}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-change-me-redis}@redis:6379/0
    depends_on:
      weaviate:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - brain-net

  # ---------------------------------------------------------------------------
  # Celery worker – consumes ingestion / skill-discovery / feedback /
  # contradiction tasks. The API enqueues; without this service those tasks
  # are never processed.
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cb-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.worker:celery_app", "worker", "-l", "info", "--concurrency=4"]
    env_file:
      - .env
    environment:
      - WEAVIATE_URL=http://weaviate:8080
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_AUTH=${NEO4J_AUTH}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cb_admin}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-companybrain}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change-me-redis}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-change-me-redis}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker:celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - brain-net

  # ---------------------------------------------------------------------------
  # Celery beat – recurring-workflow scheduler. Emits the every-60s scheduler
  # tick that fans out *governed* runs for due tenant schedules. MUST be a
  # singleton (exactly one replica) — two beats would double-fire every
  # schedule. Workers do the actual run; beat only enqueues, so it needs the
  # broker, not the data stores.
  # ---------------------------------------------------------------------------
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cb-beat
    restart: unless-stopped
    command: ["celery", "-A", "app.worker:celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-change-me-redis}@redis:6379/0
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change-me-redis}@redis:6379/0
      - SCHEDULER_TICK_SECONDS=${SCHEDULER_TICK_SECONDS:-60}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - brain-net

  # ---------------------------------------------------------------------------
  # Weaviate – Vector database
  # ---------------------------------------------------------------------------
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: cb-weaviate
    restart: unless-stopped
    ports:
      - "${WEAVIATE_PORT:-8080}:8080"
      - "50051:50051"                 # gRPC
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:-change-me}
      AUTHENTICATION_APIKEY_USERS: ${WEAVIATE_API_USER:-admin@companybrain.io}
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      QUERY_DEFAULTS_LIMIT: 25
      LOG_LEVEL: info
    volumes:
      - weaviate-data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - brain-net

  # ---------------------------------------------------------------------------
  # NOTE: Kafka + ZooKeeper were removed from the launch stack — nothing in the
  # codebase produces to or consumes from Kafka. The async task path is
  # Celery + Redis (broker). If an event bus is reintroduced later, add the
  # services back here and wire a real producer/consumer first. See
  # docs/ARCHITECTURE.md §"Why no Kafka".
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Neo4j – Knowledge graph
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: cb-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/change-me-now}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - brain-net

  # ---------------------------------------------------------------------------
  # HashiCorp Vault – Secrets management (dev mode for now)
  # ---------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.16
    container_name: cb-vault
    restart: unless-stopped
    ports:
      - "${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-only-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_LOG_LEVEL: info
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/file
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - brain-net

  # ---------------------------------------------------------------------------
  # PostgreSQL – Relational state store (skills, feedback, workflows, tenants)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cb-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-companybrain}
      POSTGRES_USER: ${POSTGRES_USER:-cb_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      # Harden: disable trust authentication, require password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cb_admin} -d ${POSTGRES_DB:-companybrain}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - brain-net

  # ---------------------------------------------------------------------------
  # Redis – Task queue broker (Celery) + rate limiter cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cb-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # noeviction (not allkeys-lru): this Redis is the Celery broker AND holds
    # quarantine safety-locks — neither may be silently evicted under memory
    # pressure (a dropped lock un-quarantines a skill). AOF on for durability
    # across restarts. Managed Redis (Upstash) must likewise be noeviction.
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-me-redis} --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - brain-net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  weaviate-data:
    driver: local
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
  vault-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  brain-net:
    driver: bridge
    name: brain-net
