name: Company Brain CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Backend: lint, test, security scan ──────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pylint pytest pytest-asyncio httpx

      - name: Bandit security scan
        run: bandit -r app/ -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json

      - name: Pylint code quality
        run: pylint app/ --disable=C0114,C0115,C0116,R0903,W0511 --fail-under=7.0 || true

      - name: Run unit tests
        run: pytest tests/ -v --tb=short || echo "No tests found yet"

  # ── Frontend: lint, build ───────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint src/ --max-warnings=10 || true

      - name: npm audit (dependency vulnerabilities)
        run: npm audit --audit-level=high || true

      - name: Build
        run: npm run build

  # ── Container security scan ─────────────────────────────────────────
  container-scan:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t company-brain-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t company-brain-frontend:ci ./frontend

      - name: Trivy scan – backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: company-brain-backend:ci
          format: table
          exit-code: 0  # warn only for now
          severity: CRITICAL,HIGH

      - name: Trivy scan – frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: company-brain-frontend:ci
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  # ── Dependency check ────────────────────────────────────────────────
  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: pip install safety

      - name: Check Python dependencies
        run: safety check -r backend/requirements.txt --output json || true

  # ── OWASP ZAP (dynamic scan – optional, needs running app) ─────────
  # Uncomment when you have a staging deployment:
  # zap-scan:
  #   name: OWASP ZAP Dynamic Scan
  #   runs-on: ubuntu-latest
